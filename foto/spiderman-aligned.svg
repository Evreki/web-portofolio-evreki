<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 427 584" width="427" height="584">
  <defs>
    <!-- 1. Nano-Hex Carbon Armor Texture (PS5 Miles Morales Suit) -->
    <pattern id="nanoHex" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#0A0C12"/>
      <path d="M4 0 L8 2 L8 6 L4 8 L0 6 L0 2 Z" fill="#131722" stroke="#1D2436" stroke-width="0.75"/>
      <circle cx="4" cy="4" r="0.9" fill="#2E384D" opacity="0.7"/>
    </pattern>

    <!-- 2. Micro Dot Grip Texture on Red Plates -->
    <pattern id="redGrip" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="#E11D48"/>
      <circle cx="2" cy="2" r="0.8" fill="#881337" opacity="0.6"/>
    </pattern>

    <!-- 3. Eye Lens Hex Mesh -->
    <pattern id="lensHexMesh" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="3" fill="transparent"/>
      <circle cx="1.5" cy="1.5" r="0.55" fill="#0284C7" opacity="0.45"/>
    </pattern>

    <!-- 4. 3D Head Lighting & Shading -->
    <radialGradient id="head3DShading" cx="48%" cy="32%" r="56%" fx="45%" fy="26%">
      <stop offset="0%" stop-color="#283144"/>
      <stop offset="30%" stop-color="#181D29"/>
      <stop offset="65%" stop-color="#0E1118"/>
      <stop offset="90%" stop-color="#07080C"/>
      <stop offset="100%" stop-color="#020305"/>
    </radialGradient>

    <!-- 5. Neck Occlusion -->
    <linearGradient id="neckGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020305"/>
      <stop offset="35%" stop-color="#0D1017"/>
      <stop offset="70%" stop-color="#161B26"/>
      <stop offset="100%" stop-color="#1F2636"/>
    </linearGradient>

    <!-- 6. Torso Pectoral Shading -->
    <radialGradient id="pecLeft" cx="35%" cy="48%" r="40%">
      <stop offset="0%" stop-color="#202738"/>
      <stop offset="60%" stop-color="#10131C"/>
      <stop offset="100%" stop-color="#06070A"/>
    </radialGradient>
    <radialGradient id="pecRight" cx="65%" cy="48%" r="40%">
      <stop offset="0%" stop-color="#202738"/>
      <stop offset="60%" stop-color="#10131C"/>
      <stop offset="100%" stop-color="#06070A"/>
    </radialGradient>

    <!-- 7. Miles Morales Crimson Red Stripe Shading -->
    <linearGradient id="crimsonWing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3358"/>
      <stop offset="25%" stop-color="#E11D48"/>
      <stop offset="70%" stop-color="#BE123C"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>

    <!-- 8. Red Web Glow Filter -->
    <filter id="webNeonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- 9. Metallic Eye Bevel Gradient -->
    <linearGradient id="eyeBevel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4D6D"/>
      <stop offset="30%" stop-color="#E11D48"/>
      <stop offset="70%" stop-color="#9F1239"/>
      <stop offset="100%" stop-color="#4C0519"/>
    </linearGradient>

    <!-- 10. Eye Lens Glass Reflection Gradient -->
    <linearGradient id="lensGlass" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#F0F9FF"/>
      <stop offset="55%" stop-color="#E0F2FE"/>
      <stop offset="85%" stop-color="#BAE6FD"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <!-- 11. Lens Glow Aura -->
    <filter id="lensGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- 12. Spider Chest Metallic Emblem Gradient -->
    <linearGradient id="emblemGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF385C"/>
      <stop offset="40%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#9F1239"/>
    </linearGradient>
  </defs>

