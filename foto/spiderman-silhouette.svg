<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 380" width="320" height="380">
  <defs>
    <!-- Glowing Eye Gradient -->
    <linearGradient id="spiderEyeGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F0F9FF"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <!-- Neon Rim Lighting Gradient -->
    <linearGradient id="spideyRim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E50914"/>
      <stop offset="50%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <!-- Body Dark Gradient -->
    <linearGradient id="spideyBody" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#18090C"/>
      <stop offset="50%" stop-color="#0E0D18"/>
      <stop offset="100%" stop-color="#06060A"/>
    </linearGradient>

    <!-- Spider-Sense Sparks Glow Filter -->
    <filter id="eyeGlowFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Spider-Sense Electric Waves (Animated Above Head) -->
  <g class="spidey-sense-waves" stroke="#38BDF8" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.9">
    <!-- Left Waves -->
    <path d="M120 45 Q100 35 90 15" stroke="#E50914" stroke-width="3.5"/>
    <path d="M105 60 Q80 50 65 30" stroke="#38BDF8" stroke-width="3"/>
    <path d="M95 80 Q65 75 45 60" stroke="#E50914" stroke-width="2.5"/>

    <!-- Right Waves -->
    <path d="M200 45 Q220 35 230 15" stroke="#38BDF8" stroke-width="3.5"/>
    <path d="M215 60 Q240 50 255 30" stroke="#E50914" stroke-width="3"/>
    <path d="M225 80 Q255 75 275 60" stroke="#38BDF8" stroke-width="2.5"/>
  </g>

  <!-- Superhero Upper Body Silhouette (Head, Neck, Torso & Muscular Shoulders) -->
  <path d="
    M160 55
    C125 55 105 82 105 125
    C105 160 120 190 142 205
    L135 225
    C95 230 45 255 15 300
    L10 380
    L310 380
    L305 300
    C275 255 225 230 185 225
    L178 205
    C200 190 215 160 215 125
    C215 82 195 55 160 55
    Z"
    fill="url(#spideyBody)"
    stroke="url(#spideyRim)"
    stroke-width="3.5"/>

  <!-- Web Pattern Grid on Mask -->
  <g stroke="#E50914" stroke-width="1.4" opacity="0.45" fill="none">
    <!-- Vertical Radial Lines from Center Forehead (160, 125) -->
    <line x1="160" y1="58" x2="160" y2="200"/>
    <line x1="160" y1="125" x2="110" y2="75"/>
    <line x1="160" y1="125" x2="210" y2="75"/>
    <line x1="160" y1="125" x2="105" y2="125"/>
    <line x1="160" y1="125" x2="215" y2="125"/>
    <line x1="160" y1="125" x2="115" y2="175"/>
    <line x1="160" y1="125" x2="205" y2="175"/>
    
    <!-- Concentric Web Catenary Rings -->
    <ellipse cx="160" cy="125" rx="22" ry="24"/>
    <ellipse cx="160" cy="125" rx="42" ry="46"/>
    <ellipse cx="160" cy="125" rx="54" ry="62"/>
  </g>

  <!-- Chest Spider Emblem (Authentic Raimi Shape) -->
  <g transform="translate(160, 290) scale(0.65)" fill="#E50914">
    <!-- Abdomen -->
    <ellipse cx="0" cy="0" rx="6" ry="14"/>
    <ellipse cx="0" cy="-14" rx="4.5" ry="6"/>
    <!-- Top Fangs -->
    <polygon points="-3,-18 0,-24 3,-18 0,-16"/>
    <!-- Legs Left -->
    <path d="M-4 -12 Q-28 -28 -22 -44 Q-20 -44 -16 -40 Q-20 -24 -2 -8" fill="#E50914"/>
    <path d="M-4 -6 Q-38 -14 -32 -32 Q-30 -32 -26 -28 Q-30 -10 -2 -2" fill="#E50914"/>
    <path d="M-4 2 Q-44 14 -40 38 Q-42 38 -45 34 Q-46 10 -2 6" fill="#E50914"/>
    <path d="M-4 8 Q-30 40 -16 65 Q-18 65 -22 60 Q-28 35 -2 12" fill="#E50914"/>
    <!-- Legs Right -->
    <path d="M4 -12 Q28 -28 22 -44 Q20 -44 16 -40 Q20 -24 2 -8" fill="#E50914"/>
    <path d="M4 -6 Q38 -14 32 -32 Q30 -32 26 -28 Q30 -10 2 -2" fill="#E50914"/>
    <path d="M4 2 Q44 14 40 38 Q42 38 45 34 Q46 10 2 6" fill="#E50914"/>
    <path d="M4 8 Q30 40 16 65 Q18 65 22 60 Q28 35 2 12" fill="#E50914"/>
  </g>

  <!-- Large Iconic Spider-Man Mask Eyes (with Glowing White/Cyan Lenses & Thick Black Bevel) -->
  <!-- Left Eye Outer Frame (Black Comic Border) -->
  <polygon points="112,108 152,138 146,154 115,134 108,118"
           fill="#000000" stroke="#000000" stroke-width="4.5" stroke-linejoin="round"/>
  <!-- Left Eye Inner Glowing Lens -->
  <polygon points="116,112 148,136 142,150 118,132 112,120"
           fill="url(#spiderEyeGlow)" filter="url(#eyeGlowFilter)"/>

  <!-- Right Eye Outer Frame (Black Comic Border) -->
  <polygon points="208,108 168,138 174,154 205,134 212,118"
           fill="#000000" stroke="#000000" stroke-width="4.5" stroke-linejoin="round"/>
  <!-- Right Eye Inner Glowing Lens -->
  <polygon points="204,112 172,136 178,150 202,132 208,120"
           fill="url(#spiderEyeGlow)" filter="url(#eyeGlowFilter)"/>
</svg>
