      <stop offset="0%" stop-color="#E50914"/>
      <stop offset="60%" stop-color="#B00020"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>

  <!-- NeoBrutalist Hard Drop Shadow -->
