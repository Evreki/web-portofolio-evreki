<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="spiderBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E50914"/>
      <stop offset="60%" stop-color="#B00020"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="eyeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E0F2FE"/>
    </linearGradient>
  </defs>

  <!-- NeoBrutalist Hard Drop Shadow -->
  <rect x="6" y="6" width="56" height="56" rx="10" fill="#000000"/>

  <!-- Main Badge Box -->
  <rect x="2" y="2" width="56" height="56" rx="10" fill="url(#spiderBg)" stroke="#000000" stroke-width="3.5"/>

  <!-- Spider Web Matrix Lines -->
  <path d="M30 4 L30 56 M4 30 L56 30 M12 12 L48 48 M12 48 L48 12" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1.8" stroke-dasharray="none"/>
  
  <!-- Web Rings -->
  <circle cx="30" cy="30" r="14" fill="none" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.5"/>
  <circle cx="30" cy="30" r="22" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1.5"/>

  <!-- Spider-Man Iconic Angular Eye Lenses (NeoBrutalist Black Outline) -->
  <!-- Left Eye Outer -->
  <polygon points="12,22 28,34 26,38 12,32 10,26" fill="#000000" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <!-- Left Eye Lens -->
  <polygon points="14,24 26,33 24,36 14,31 12,27" fill="url(#eyeGrad)"/>

  <!-- Right Eye Outer -->
  <polygon points="48,22 32,34 34,38 48,32 50,26" fill="#000000" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <!-- Right Eye Lens -->
  <polygon points="46,24 34,33 36,36 46,31 48,27" fill="url(#eyeGrad)"/>

  <!-- Center Spider Emblem Accent -->
  <circle cx="30" cy="30" r="2.5" fill="#38BDF8" stroke="#000000" stroke-width="1"/>
</svg>
