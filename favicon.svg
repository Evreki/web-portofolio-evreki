  <circle cx="30" cy="30" r="15" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1.2"/>
  <circle cx="30" cy="30" r="23" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1.2"/>

